name: Build A155F ROM (RestlessOS 17 + v1.0 kernel → Odin AP)

# One-shot ROM packager for SM-A155F:
#   stock CYG4 firmware (Samsung FUS, version-pinned) + RestlessOS 17 GSI
#   + our already-released v1.0 kernel (sha256-pinned, NOT rebuilt)
#   → single Odin-flashable AP tar(.md5), split for GitHub release limits.
#
# See docs/ROM_BUILD.md for architecture and user flashing guide.

on:
  workflow_dispatch:
    inputs:
      kernel_variant:
        description: "v1.0 kernel variant (SIM-fix module needs a rooted one; vanilla = no RIL fix)"
        type: choice
        options:
          - bakasu
          - kernelsunext
          - vanilla
        default: bakasu
      fw_version:
        description: "Stock firmware to base vendor/product/odm on"
        default: "A155FXXS7CYG4"
        required: true
      fw_region:
        description: "Samsung region/CSC code for the FUS download"
        default: "TUR"
        required: true
      fw_url:
        description: "Optional: direct URL of the stock firmware zip (bypasses Samsung FUS, e.g. link-shared Drive file)"
        default: ""
        required: false
      restless_ref:
        description: "treble_restlessos release tag (empty = latest)"
        default: ""
      release_tag:
        description: "Tag of the prerelease that receives the ROM package"
        default: "rom-v1.0"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: rom-build

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  KERNEL_VARIANT: ${{ inputs.kernel_variant }}
  FW_VERSION: ${{ inputs.fw_version }}
  FW_REGION: ${{ inputs.fw_region }}
  FW_URL: ${{ inputs.fw_url }}
  RESTLESS_REF: ${{ inputs.restless_ref }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift /usr/local/.ghcup 2>/dev/null || true
          docker rmi -f $(docker images -aq) 2>/dev/null || true
          sudo swapoff -a || true
          df -h /

      - name: Base packages (apt, tolerant — nothing critical here)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends xz-utils zip unzip lz4 file erofs-utils f2fs-tools \
            || sudo apt-get install -y --no-install-recommends xz-utils zip unzip lz4 || true
          command -v xz zip unzip git curl python3 && echo "base OK"

      - name: samloader (pip, from GitHub)
        run: |
          pip install --break-system-packages "git+https://github.com/nlscc/samloader.git" 2>/dev/null \
            || pip install "git+https://github.com/nlscc/samloader.git" \
            || python3 -m pip install --break-system-packages "git+https://github.com/nlscc/samloader.git"
          samloader --help 2>&1 | head -3

      - name: Provision build tools (rom/tools.sh — sandbox-proven)
        run: |
          rom/tools.sh
          for d in tools/lptools/linux_glibc_x86_64 tools/lz4 tools/e2fsprogs/b/misc tools/e2fsprogs/b/debugfs tools/e2fsprogs/b/e2fsck tools/e2fsprogs/b/resize; do
            echo "$PWD/$d" >> "$GITHUB_PATH"
          done

      - name: Verify toolchain
        run: |
          command -v lpmake lpunpack lz4 mke2fs debugfs e2fsck resize2fs samloader
          (command -v lpdump || command -v lpdumps)
          test -f tools/avb/avbtool.py && echo "avbtool OK"

      - name: Fetch kernel — v1.0 artifact (sha256-pinned)
        run: |
          mkdir -p work
          set -o pipefail
          rom/fetch-inputs.sh kernel 2>&1 | tee work/fetch-kernel.log

      - name: Fetch RestlessOS GSI (sha512-verified)
        run: |
          mkdir -p work
          set -o pipefail
          rom/fetch-inputs.sh gsi 2>&1 | tee work/fetch-gsi.log

      - name: Fetch stock firmware (Samsung FUS, version-pinned)
        run: |
          mkdir -p work
          set -o pipefail
          rom/fetch-inputs.sh firmware 2>&1 | tee work/fetch-firmware.log

      - name: Extract stock AP members
        run: |
          set -o pipefail
          rom/extract-ap.sh 2>&1 | tee work/step-extract.log

      - name: Build RIL-fix module (manager APKs are separate release assets)
        run: |
          set -o pipefail
          rom/build-rilfix-module.sh 2>&1 | tee work/step-rilfix.log

      - name: Modify GSI (embed extras)
        run: |
          set -o pipefail
          rom/modify-gsi.sh 2>&1 | tee work/step-modify-gsi.log

      - name: Repack super (GSI system + stock vendor/product/odm)
        run: |
          set -o pipefail
          rom/repack-super.sh 2>&1 | tee work/step-repack.log

      - name: Disabled vbmeta image(s)
        run: |
          set -o pipefail
          rom/make-vbmeta.sh 2>&1 | tee work/step-vbmeta.log

      - name: Assemble AP tar.md5 + split + checksums
        run: |
          set -o pipefail
          rom/pack-ap.sh 2>&1 | tee work/step-pack.log

      - name: Render release notes
        run: |
          set -o pipefail
          rom/render-notes.sh 2>&1 | tee work/step-notes.log

      - name: Publish variant assets without replacing existing release files
        run: |
          set -euo pipefail
          cd out
          # Do not edit an existing release's title, notes, prerelease status, or assets.
          # The owner maintains the combined release description after all variants are ready.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "RestlessOS 17 (GrapheneOS fork) — SM-A155F — ROM variants (Odin AP)" \
              --notes "See repository README for variant details and installation guidance."
          fi
          cd dist
          RTAG=$(cat ../../work/gsi/TAG)
          APBASE="AP_SM-A155F_RestlessOS-${RTAG}_${KERNEL_VARIANT}_${FW_VERSION}"
          SUMFILE="${APBASE}.SHA256SUMS.txt"
          sha256sum -c "$SUMFILE" >/dev/null
          for f in "${APBASE}.tar.md5."* "$SUMFILE"; do
            [ -f "$f" ] || { echo "missing expected variant asset: $f"; exit 1; }
            echo "uploading $f (no clobber)"
            gh release upload "$RELEASE_TAG" "$f"
          done
          echo "DONE: $(gh release view "$RELEASE_TAG" --json url --jq .url)"

      - name: Report failure details (CI logs are unreadable from the maintainer sandbox)
        if: failure()
        run: |
          BODY=$( { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID";
                    echo "Variant: $KERNEL_VARIANT  FW: $FW_VERSION/$FW_REGION"; echo; echo '```';
                    for f in work/fetch-*.log work/step-*.log; do [ -f "$f" ] && { echo "=== $f (tail) ==="; tail -25 "$f"; echo; };
                    done; echo "=== work/ ==="; ls -laR work 2>/dev/null | head -50;
                    echo "=== out/ ==="; ls -laR out 2>/dev/null | head -20; echo '```'; } | head -c 60000 )
          gh issue create --title "ROM CI failure — run $GITHUB_RUN_ID ($KERNEL_VARIANT)" \
            --body "$BODY" --label "ci-failure" || true
